<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header fade-slide">
    <h1>👋 Welcome, <span id="userName">User</span></h1>
    <p class="subtitle">Manage your Telegram Ads Accounts</p>
  </header>

  <!-- MAIN -->
  <main class="container">

    <!-- PROFILE SUMMARY -->
    <section class="profile-card fade-slide">
      <div>
        <h3>👤 Profile</h3>
        <p id="profileName">Name</p>
      </div>
      <div>
        <h3>📊 Accounts</h3>
        <p><span id="totalAccounts">0</span> total</p>
      </div>
    </section>

    <!-- ADD ACCOUNT -->
    <section class="actions fade-slide">
      <button class="btn-primary" onclick="openAddAccount()">
        ➕ Add Telegram Ads Account
      </button>
    </section>

    <!-- ACCOUNTS LIST -->
    <section id="accountsContainer" class="accounts-grid">
      <!-- Account cards injected by JS -->
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
