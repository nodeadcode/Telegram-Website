<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard – AutoGram</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="dash">

  <!-- SIDEBAR -->
  <aside class="sidebar animate-left">
    <h2 class="logo">AutoGram</h2>
    <nav>
      <a class="active">👥 Groups</a>
      <a>📨 Message</a>
      <a>⏱ Schedule</a>
      <a>🌙 Night Mode</a>
      <a>💳 Subscription</a>
      <a class="logout">Logout</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="content animate-in">

    <header class="dash-header">
      <div>
        <h3>Dashboard</h3>
        <p class="muted">Telegram connected</p>
      </div>
      <button class="upgrade-btn">Upgrade</button>
    </header>

    <section class="card">
      <h4>Add Telegram Group</h4>
      <input placeholder="https://t.me/group">
      <input type="datetime-local">
      <button class="primary-btn">Add Group</button>
    </section>

    <section class="card">
      <h4>Status</h4>
      <p class="muted">Free Trial · 2 / 2 groups used</p>
    </section>

  </main>

</div>

</body>
</html>
