<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard – AutoGram</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

<aside class="sidebar">
  <h2>AutoGram</h2>
  <ul>
    <li onclick="show('groups')">👥 Groups</li>
    <li onclick="show('message')">📨 Message</li>
    <li onclick="show('schedule')">⏱ Schedule</li>
    <li onclick="show('night')">🌙 Night Mode</li>
    <li onclick="show('subscription')">💳 Subscription</li>
    <li onclick="logout()">🚪 Logout</li>
  </ul>
</aside>

<main class="main">

<!-- GROUPS -->
<section id="groups" class="card">
  <h3>Add Group</h3>
  <input id="groupLink" placeholder="https://t.me/group">
  <input id="expiry" type="datetime-local">
  <button onclick="addGroup()">Add</button>

  <table>
    <thead><tr><th>Group</th><th>Expires</th></tr></thead>
    <tbody id="groupList"></tbody>
  </table>
</section>

<!-- MESSAGE -->
<section id="message" class="card hidden">
  <h3>Ad Message</h3>
  <textarea id="msg" rows="6" placeholder="Write your message"></textarea>
  <button onclick="saveMessage()">Save</button>
</section>

<!-- SCHEDULE -->
<section id="schedule" class="card hidden">
  <h3>Delay</h3>
  <input type="number" id="delay" value="20" min="20">
  <button onclick="start()">Start</button>
  <button onclick="stop()">Stop</button>
  <p id="status"></p>
</section>

<!-- NIGHT MODE -->
<section id="night" class="card hidden">
  <label>
    <input type="checkbox" id="nightToggle"> Enable Night Mode
  </label>
  <input type="time">
  <input type="time">
</section>

<!-- SUBSCRIPTION -->
<section id="subscription" class="card hidden">
  <h3>Upgrade</h3>
  <p>Pro Plan – ₹99 / month</p>
  <button>Upgrade Now</button>
</section>

</main>
</div>

<script src="script.js"></script>
</body>
</html>
