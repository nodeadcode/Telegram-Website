<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoGram Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>AutoGram</h2>
    <ul>
      <li class="active">👥 Groups</li>
      <li>📨 Message</li>
      <li>⏱ Schedule</li>
      <li>🌙 Night Mode</li>
      <li>💳 Subscription</li>
      <li>🚪 Logout</li>
    </ul>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <span>Telegram Connected ✅</span>
      <button class="upgrade">Upgrade</button>
    </header>

    <section class="card">
      <h3>Add Telegram Group</h3>

      <input id="groupLink" placeholder="https://t.me/yourgroup">
      
      <label>Expiry Date & Time</label>
      <input type="datetime-local" id="expiry">

      <button onclick="addGroup()">➕ Add Group</button>

      <p class="hint">Free users: max 2 groups • Paid: 10 groups</p>
    </section>

    <section class="card">
      <h3>Active Groups</h3>

      <table>
        <thead>
          <tr>
            <th>Group</th>
            <th>Expires</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="groupList"></tbody>
      </table>
    </section>

  </main>

</div>

<script src="script.js"></script>
</body>
</html>
