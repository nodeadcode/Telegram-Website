<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – AutoGram</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="auth-body">

<div class="auth-card animate-in">
  <h2>Connect Telegram</h2>
  <p class="muted">Official OTP-based Telegram login</p>

  <input placeholder="API ID">
  <input placeholder="API Hash">
  <input placeholder="+91 Phone number">

  <button class="primary-btn">Send OTP</button>

  <div class="divider">OTP</div>

  <input placeholder="Enter OTP">
  <button class="primary-btn">Verify & Continue</button>

  <p class="trust-text">
    🔒 We never store your password or OTP
  </p>
</div>

</body>
</html>
